name: Publish npm package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write


jobs:
  publish:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v5


      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/


      - name: Update npm
        run: npm install -g npm@latest


      - name: Check versions
        run: |
          node -v
          npm -v


      - name: Install
        run: npm install


      - name: Build
        run: npm run build


      - name: Publish
        run: npm publish --provenance --access public